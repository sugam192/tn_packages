[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tamingnifty"
# This is the ONLY place the version lives. The publish workflow checks that the
# git tag you push matches this number.
version = "2.0.2"
description = "A library for converting OHLC to Noiseless Charts (Renko and PNF)"
authors = [{ name="Sugam Gupta", email="sugam192@gmail.com" }]
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.7"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "python-dateutil",
    "pyotp",
    "retry",
    "slack_sdk",
    "python-dotenv"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# pyintegrate is only needed by connect_definedge.py and tick_streamer.py, which are
# the Definedge-only modules. Nothing else in the package imports it, so it is kept
# out of the main list - that way a Dhan container does not have to install Definedge's
# SDK. If you ever want the Definedge modules, install with:
#     pip install tamingnifty[definedge]
[project.optional-dependencies]
definedge = ["pyintegrate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tamingnifty*"]
