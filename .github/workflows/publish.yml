name: Publish tamingnifty to PyPI

# Publishing is tied to a git tag, so there is exactly one way to release:
#
#   1. bump `version` in pyproject.toml   (e.g. 2.0.0)
#   2. git commit + git push
#   3. git tag v2.0.0
#   4. git push origin v2.0.0            <- this is what triggers the release
#
# The tag and the version in pyproject.toml must match, and the package must build
# AND install AND import cleanly, before anything is uploaded to PyPI. If a run
# fails, fix it and use "Re-run jobs" in the Actions tab - you do not need to
# delete and recreate the tag.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required by PyPI Trusted Publishing. This lets GitHub prove to PyPI who it
    # is, so no API token needs to be stored in this repo at all.
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the tag matches the version in pyproject.toml
        run: |
          TAG=${GITHUB_REF_NAME#v}
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "git tag        : $TAG"
          echo "pyproject.toml : $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: tag v$TAG does not match version $VERSION in pyproject.toml."
            echo "Bump the version in pyproject.toml, or retag to match it."
            exit 1
          fi
          echo "OK - versions match."

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build the package
        run: python -m build

      - name: Check the built package
        run: |
          python -m twine check dist/*
          ls -l dist/

      - name: Install the built package and import every module
        # [definedge] pulls in pyintegrate, which connect_definedge.py and
        # tick_streamer.py need. Without it those two modules cannot be imported.
        #
        # The "cd .." matters. If you stay in the repo folder, Python finds the
        # local tamingnifty/ source folder first and imports that instead of the
        # package we just installed - so the test would pass even if the wheel
        # were completely broken.
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[definedge]"
          cd ..
          python -c "import tamingnifty; print('installed from:', tamingnifty.__file__)"
          python -c "from tamingnifty import utils;             print('utils OK')"
          python -c "from tamingnifty import ta;                print('ta OK')"
          python -c "from tamingnifty import connect_dhan;      print('connect_dhan OK')"
          python -c "from tamingnifty import connect_definedge; print('connect_definedge OK')"
          python -c "from tamingnifty import tick_streamer;     print('tick_streamer OK')"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
